<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Uang Jalan Driver</title>

<style>
body{
  font-family:Arial,Helvetica,sans-serif;
  background:#f4f6f9;
  padding:20px
}

h2{margin-bottom:10px}

table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  box-shadow:0 2px 6px rgba(0,0,0,.1)
}

th,td{
  padding:8px;
  border-bottom:1px solid #ddd;
  text-align:center;
  font-size:13px
}

th{background:#f0f0f0}

.totalbox{
  margin-top:15px;
  font-weight:bold;
  font-size:16px
}
</style>

</head>
<body>

<h2>Dashboard Uang Jalan Driver</h2>

<table>
<thead>
<tr>
<th>No</th>
<th>Tanggal</th>
<th>Trip</th>
<th>Asal</th>
<th>Tujuan</th>
<th>Nopol</th>
<th>Solar</th>
<th>Tol</th>
<th>D1</th>
<th>D2</th>
<th>Asam</th>
<th>Total</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<div class="totalbox" id="grandTotal">Grand Total : 0</div>

<script>

const SUPABASE_URL = "https://jlhfzgxddlmyfdlwjlzs.supabase.co";
const SUPABASE_KEY = "sb_publishable_zc8JApZLnG1D1M2xpDP7tA_H7RnxZ_T";
const TABLE = "uang_jalan_driver";

async function loadData(){

  const res = await fetch(
    `${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.desc`,
    {
      headers:{
        "apikey":SUPABASE_KEY,
        "Authorization":"Bearer "+SUPABASE_KEY
      }
    }
  );

  const data = await res.json();

  render(data);
}

function render(data){

  const tbody = document.getElementById("tbody");
  tbody.innerHTML="";

  let grandTotal = 0;

  data.forEach((d,i)=>{

    grandTotal += Number(d.total||0);

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${i+1}</td>
      <td>${d.tanggal||""}</td>
      <td>${d.nama_trip_customer||""}</td>
      <td>${d.kota_asal||""}</td>
      <td>${d.tujuan_bongkar||""}</td>
      <td>${d.nopol||""}</td>
      <td>${Number(d.solar||0).toLocaleString('id-ID')}</td>
      <td>${Number(d.tol||0).toLocaleString('id-ID')}</td>
      <td>${Number(d.upah1||0).toLocaleString('id-ID')}</td>
      <td>${Number(d.upah2||0).toLocaleString('id-ID')}</td>
      <td>${Number(d.asam||0).toLocaleString('id-ID')}</td>
      <td>${Number(d.total||0).toLocaleString('id-ID')}</td>
    `;

    tbody.appendChild(tr);
  });

  document.getElementById("grandTotal").innerText =
    "Grand Total : "+grandTotal.toLocaleString('id-ID');
}

loadData();

</script>

</body>
</html>
