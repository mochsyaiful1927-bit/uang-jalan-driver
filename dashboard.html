<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Uang Jalan Driver</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f6f9;
padding:20px;
}

h1{
margin-bottom:20px;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(200px,1fr));
gap:15px;
margin-bottom:20px;
}

.card{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

.card h3{
margin:0;
font-size:14px;
color:#777;
}

.card p{
font-size:22px;
font-weight:bold;
margin-top:5px;
}

.chartbox{
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
margin-bottom:20px;
}

table{
width:100%;
border-collapse:collapse;
background:white;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
}

th,td{
padding:8px;
border-bottom:1px solid #ddd;
font-size:13px;
text-align:center;
}

th{
background:#f0f0f0;
}

.filter{
margin-bottom:15px;
}

</style>
</head>

<body>

<h1>Dashboard Uang Jalan Driver</h1>

<div class="cards">

<div class="card">
<h3>Total Trip</h3>
<p id="trip">0</p>
</div>

<div class="card">
<h3>Total Solar</h3>
<p id="solar">0</p>
</div>

<div class="card">
<h3>Total Tol</h3>
<p id="tol">0</p>
</div>

<div class="card">
<h3>Total Pengeluaran</h3>
<p id="total">0</p>
</div>

</div>

<div class="chartbox">
<canvas id="chart"></canvas>
</div>

<div class="filter">
Filter tanggal :
<input type="date" id="tgl1">
s/d
<input type="date" id="tgl2">
<button onclick="filter()">Filter</button>
</div>

<table>

<thead>
<tr>
<th>No</th>
<th>Tanggal</th>
<th>Trip</th>
<th>Nopol</th>
<th>Solar</th>
<th>Tol</th>
<th>Total</th>
</tr>
</thead>

<tbody id="tbody"></tbody>

</table>

<script>

const SUPABASE_URL="https://jlhfzgxddlmyfdlwjlzs.supabase.co";
const SUPABASE_KEY="sb_publishable_zc8JApZLnG1D1M2xpDP7tA_H7RnxZ_T";
const TABLE="uang_jalan_driver";

let allData=[];

async function loadData(){

const res=await fetch(
`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.desc`,
{
headers:{
"apikey":SUPABASE_KEY,
"Authorization":"Bearer "+SUPABASE_KEY
}
}
);

allData=await res.json();

render(allData);

}

function render(data){

const tbody=document.getElementById("tbody");
tbody.innerHTML="";

let totalSolar=0;
let totalTol=0;
let totalAll=0;

data.forEach((d,i)=>{

totalSolar+=Number(d.solar||0);
totalTol+=Number(d.tol||0);
totalAll+=Number(d.total||0);

const tr=document.createElement("tr");

tr.innerHTML=`
<td>${i+1}</td>
<td>${d.tanggal||""}</td>
<td>${d.nama_trip_customer||""}</td>
<td>${d.nopol||""}</td>
<td>${Number(d.solar||0).toLocaleString('id-ID')}</td>
<td>${Number(d.tol||0).toLocaleString('id-ID')}</td>
<td>${Number(d.total||0).toLocaleString('id-ID')}</td>
`;

tbody.appendChild(tr);

});

document.getElementById("trip").innerText=data.length;
document.getElementById("solar").innerText=totalSolar.toLocaleString('id-ID');
document.getElementById("tol").innerText=totalTol.toLocaleString('id-ID');
document.getElementById("total").innerText=totalAll.toLocaleString('id-ID');

buatChart(totalSolar,totalTol,totalAll);

}

function buatChart(solar,tol,total){

new Chart(document.getElementById("chart"),{

type:'bar',

data:{
labels:["Solar","Tol","Total"],
datasets:[{
label:"Pengeluaran",
data:[solar,tol,total]
}]
}

});

}

function filter(){

const t1=document.getElementById("tgl1").value;
const t2=document.getElementById("tgl2").value;

const hasil=allData.filter(d=>{
return d.tanggal>=t1 && d.tanggal<=t2;
});

render(hasil);

}

loadData();

</script>

</body>
</html>
