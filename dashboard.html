<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Dashboard Uang Jalan Driver</title>

<style>

body{
font-family:Arial,Helvetica,sans-serif;
background:#f4f6f9;
padding:25px;
}

h2{
margin-bottom:15px;
}

.topbar{
display:flex;
justify-content:space-between;
margin-bottom:15px;
}

input{
padding:8px;
border:1px solid #ccc;
border-radius:6px;
}

.tablebox{
background:white;
border-radius:10px;
box-shadow:0 3px 8px rgba(0,0,0,0.1);
overflow:auto;
}

table{
width:100%;
border-collapse:collapse;
font-size:13px;
}

th,td{
padding:8px;
border-bottom:1px solid #eee;
text-align:center;
}

th{
background:#f1f5f9;
font-weight:bold;
}

tr:hover{
background:#f9fafb;
}

.totalbox{
margin-top:12px;
font-size:16px;
font-weight:bold;
}

</style>
</head>

<body>

<h2>Dashboard Uang Jalan Driver</h2>

<div class="topbar">
<input type="text" id="search" placeholder="Cari nopol / trip..." onkeyup="searchData()">
</div>

<div class="tablebox">

<table>

<thead>

<tr>
<th>No</th>
<th>Trip</th>
<th>Asal</th>
<th>Tujuan</th>
<th>Nopol</th>
<th>Jarak</th>
<th>Tonase</th>
<th>Solar</th>
<th>Tol</th>
<th>Driver 1</th>
<th>Driver 2</th>
<th>Asam</th>
<th>Total</th>
</tr>

</thead>

<tbody id="tbody"></tbody>

</table>

</div>

<div class="totalbox" id="grandTotal">Grand Total : 0</div>

<script>

const SUPABASE_URL="https://jlhfzgxddlmyfdlwjlzs.supabase.co";
const SUPABASE_KEY="sb_publishable_zc8JApZLnG1D1M2xpDP7tA_H7RnxZ_T";
const TABLE="uang_jalan_driver";

let dataGlobal=[];

async function loadData(){

const res=await fetch(
`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=nama_trip_customer.asc,tanggal.desc`,
{
headers:{
apikey:SUPABASE_KEY,
Authorization:"Bearer "+SUPABASE_KEY
}
}
);

dataGlobal=await res.json();

render(dataGlobal);

}

function render(data){

const tbody=document.getElementById("tbody");
tbody.innerHTML="";

let grand=0;

data.forEach((d,i)=>{

grand+=Number(d.total||0);

const tr=document.createElement("tr");

tr.innerHTML=`

<td>${i+1}</td>
<td>${d.nama_trip_customer||""}</td>
<td>${d.kota_asal||""}</td>
<td>${d.tujuan_bongkar||""}</td>
<td>${d.nopol||""}</td>
<td>${d.jarak||0}</td>
<td>${d.tonase||0}</td>
<td>${Number(d.solar||0).toLocaleString('id-ID')}</td>
<td>${Number(d.tol||0).toLocaleString('id-ID')}</td>
<td>${Number(d.upah1||0).toLocaleString('id-ID')}</td>
<td>${Number(d.upah2||0).toLocaleString('id-ID')}</td>
<td>${Number(d.asam||0).toLocaleString('id-ID')}</td>
<td>${Number(d.total||0).toLocaleString('id-ID')}</td>

`;

tbody.appendChild(tr);

});

document.getElementById("grandTotal").innerText=
"Grand Total : "+grand.toLocaleString('id-ID');

}

function searchData(){

const keyword=document.getElementById("search").value.toLowerCase();

const hasil=dataGlobal.filter(d=>

(d.nopol||"").toLowerCase().includes(keyword) ||
(d.nama_trip_customer||"").toLowerCase().includes(keyword)

);

render(hasil);

}

loadData();

</script>

</body>
</html>
